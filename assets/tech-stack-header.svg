<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="100%" height="100%">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="tsAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFDB70"/>
    </linearGradient>
    <pattern id="tsGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="180" rx="14" fill="url(#tsBg)" stroke="#1E293B" stroke-width="1.2"/>
  <rect width="1200" height="180" rx="14" fill="url(#tsGrid)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#tsAccent)"/>

  <g transform="translate(50, 0)">
    <!-- Top Meta Tag -->
    <g transform="translate(0, 26)">
      <rect width="340" height="24" rx="12" fill="#111D38" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#00F2FE"/>
      <text x="26" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#93C5FD" letter-spacing="1.5">• VERIFIED PRODUCTION STACK • DELOITTE IAM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      TECH STACK <tspan font-size="18" font-weight="500" fill="#94A3B8">/ 56 Enterprise Technologies Across 8 Core Disciplines</tspan>
    </text>

    <!-- Category Filter Pills Strip -->
    <g transform="translate(0, 116)">
      <!-- All Skills (56) -->
      <rect x="0" y="0" width="120" height="30" rx="15" fill="#222016" stroke="#FFDB70" stroke-width="1.2"/>
      <circle cx="14" cy="15" r="3.5" fill="#FFDB70"/>
      <text x="24" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FFDB70">ALL SKILLS (56)</text>

      <!-- IAM / IGA (8) -->
      <rect x="130" y="0" width="125" height="30" rx="15" fill="#082433" stroke="#00F2FE" stroke-width="1"/>
      <circle cx="144" cy="15" r="3.5" fill="#00F2FE"/>
      <text x="154" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">IAM / IGA (8)</text>

      <!-- Data & Automation (7) -->
      <rect x="265" y="0" width="175" height="30" rx="15" fill="#0E1F38" stroke="#336791" stroke-width="1"/>
      <circle cx="279" cy="15" r="3.5" fill="#336791"/>
      <text x="289" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#93C5FD">DATA &amp; AUTOMATION (7)</text>

      <!-- AI & Agentic AI (4) -->
      <rect x="450" y="0" width="160" height="30" rx="15" fill="#211233" stroke="#A855F7" stroke-width="1"/>
      <circle cx="464" cy="15" r="3.5" fill="#A855F7"/>
      <text x="474" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#D8B4FE">AI &amp; AGENTIC AI (4)</text>

      <!-- Cloud (4) -->
      <rect x="620" y="0" width="98" height="30" rx="15" fill="#2B1B0D" stroke="#FF9900" stroke-width="1"/>
      <circle cx="634" cy="15" r="3.5" fill="#FF9900"/>
      <text x="644" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FDBA74">CLOUD (4)</text>

      <!-- DevOps & Infra (8) -->
      <rect x="728" y="0" width="155" height="30" rx="15" fill="#0E2138" stroke="#2496ED" stroke-width="1"/>
      <circle cx="742" cy="15" r="3.5" fill="#2496ED"/>
      <text x="752" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60A5FA">DEVOPS &amp; INFRA (8)</text>

      <!-- Security (5) -->
      <rect x="893" y="0" width="115" height="30" rx="15" fill="#0D261C" stroke="#10B981" stroke-width="1"/>
      <circle cx="907" cy="15" r="3.5" fill="#10B981"/>
      <text x="917" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#6EE7B7">SECURITY (5)</text>

      <!-- Programming (15) -->
      <rect x="1018" y="0" width="82" height="30" rx="15" fill="#0E2235" stroke="#3776AB" stroke-width="1"/>
      <text x="1028" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7DD3FC">DEV (15)</text>
    </g>
  </g>
</svg>