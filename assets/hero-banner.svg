<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#86BC25"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Top Ambient Glow Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGrad)"/>
  <rect x="0" y="4" width="1200" height="120" fill="url(#glowGrad)"/>

  <!-- Corner Security Decorative Elements -->
  <g opacity="0.4" stroke="#00F2FE" stroke-width="1.5" fill="none">
    <path d="M 30 50 L 30 30 L 50 30"/>
    <path d="M 1170 50 L 1170 30 L 1150 30"/>
    <path d="M 30 270 L 30 290 L 50 290"/>
    <path d="M 1170 270 L 1170 290 L 1150 290"/>
  </g>

  <!-- Content Container -->
  <g transform="translate(60, 0)">
    
    <!-- Status / Role Badge -->
    <g transform="translate(0, 48)">
      <rect width="365" height="30" rx="15" fill="#111D38" stroke="#1E3A5F" stroke-width="1"/>
      <circle cx="16" cy="15" r="4.5" fill="#86BC25"/>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">DELOITTE · CYBER &amp; STRATEGIC RISK</text>
    </g>

    <!-- Main Name -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
      Subhajit Kar
    </text>
    
    <!-- Title Line -->
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#38BDF8" letter-spacing="0.5">
      Senior IAM Assistant Manager <tspan fill="#64748B">|</tspan> <tspan fill="#E2E8F0">Enterprise Identity &amp; Data Analytics Leader</tspan>
    </text>

    <!-- Pillars / Domains -->
    <text x="0" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      Saviynt IGA Governance <tspan fill="#38BDF8">•</tspan> 300K+ Monthly Identity Reconciliation <tspan fill="#38BDF8">•</tspan> JML Automation <tspan fill="#38BDF8">•</tspan> Autonomous AI Dev Team
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 246)">
      <!-- Badge 1: Saviynt Certified -->
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#13233F" stroke="#1D4ED8" stroke-width="1"/>
      <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#60A5FA">SAVIYNT IGA CERTIFIED</text>

      <!-- Badge 2: CRISC (ISACA) -->
      <rect x="180" y="0" width="130" height="28" rx="6" fill="#1B261D" stroke="#15803D" stroke-width="1"/>
      <text x="194" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#4ADE80">ISACA CRISC</text>

      <!-- Badge 3: ISO 27001 -->
      <rect x="322" y="0" width="180" height="28" rx="6" fill="#1A2035" stroke="#3730A3" stroke-width="1"/>
      <text x="334" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#A5B4FC">ISO/IEC 27001 AUDITOR</text>

      <!-- Badge 4: M.Tech Cyber Security -->
      <rect x="514" y="0" width="220" height="28" rx="6" fill="#261E35" stroke="#7E22CE" stroke-width="1"/>
      <text x="526" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#D8B4FE">M.TECH CYBER SECURITY (NFSU)</text>
    </g>
  </g>

  <!-- Right Side Cyber Shield / Graphic Motif -->
  <g transform="translate(970, 70)" opacity="0.85">
    <polygon points="90,10 160,40 160,110 90,160 20,110 20,40" fill="#0C1A35" stroke="#00F2FE" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="90,25 145,50 145,102 90,142 35,102 35,50" fill="#11254A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Keyhole / Identity Icon -->
    <circle cx="90" cy="72" r="14" fill="#00F2FE" opacity="0.9"/>
    <path d="M 83 78 L 97 78 L 94 104 L 86 104 Z" fill="#00F2FE" opacity="0.9"/>
    <!-- Orbiting Data Nodes -->
    <circle cx="160" cy="40" r="5" fill="#86BC25"/>
    <circle cx="20" cy="110" r="4" fill="#60A5FA"/>
    <circle cx="90" cy="160" r="5" fill="#00F2FE"/>
  </g>
</svg>
